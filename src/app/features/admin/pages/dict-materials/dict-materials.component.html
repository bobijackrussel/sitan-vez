<section class="admin-dictionary">
  <header>
    <h1>Materials</h1>
    <p>Maintain materials dictionary.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="save()">
    <label>
      <span>Material name</span>
      <input formControlName="naziv" placeholder="Material">
      <app-form-field-error [control]="form.get('naziv')"></app-form-field-error>
    </label>
    <button type="submit" [disabled]="saving">{{ saving ? 'Saving...' : 'Add material' }}</button>
  </form>

  <div *ngIf="loading">Loading materials...</div>
  <ul *ngIf="!loading && materials.length > 0">
    <li *ngFor="let material of materials">
      {{ material.naziv }}
      <button type="button" (click)="remove(material)">Remove</button>
    </li>
  </ul>
  <p *ngIf="!loading && materials.length === 0">No materials recorded.</p>
</section>
