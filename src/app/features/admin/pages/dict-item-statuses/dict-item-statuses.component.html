<section class="admin-dictionary">
  <header>
    <h1>Item statuses</h1>
    <p>Maintain allowed order line statuses.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="save()">
    <label>
      <span>Status name</span>
      <input formControlName="naziv" placeholder="Status">
      <app-form-field-error [control]="form.get('naziv')"></app-form-field-error>
    </label>
    <button type="submit" [disabled]="saving">{{ saving ? 'Saving...' : 'Add item status' }}</button>
  </form>

  <div *ngIf="loading">Loading item statuses...</div>
  <ul *ngIf="!loading && itemStatuses.length > 0">
    <li *ngFor="let status of itemStatuses">
      {{ status.naziv }}
      <button type="button" (click)="remove(status)">Remove</button>
    </li>
  </ul>
  <p *ngIf="!loading && itemStatuses.length === 0">No item statuses recorded.</p>
</section>
